<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Invitation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background -->
    <div class="background">
        <div class="moon"></div>
        <div class="light"></div>
        <div class="star" style="top:10%;left:15%;"></div>
        <div class="star" style="top:25%;left:75%;animation-delay:.5s;"></div>
        <div class="star" style="top:45%;left:8%;animation-delay:1s;"></div>
        <div class="star" style="top:65%;left:85%;animation-delay:1.5s;"></div>
        <div class="star" style="top:80%;left:25%;animation-delay:2s;"></div>
        <div class="star" style="top:15%;left:48%;animation-delay:.8s;"></div>
        <div class="star" style="top:55%;left:55%;animation-delay:1.2s;"></div>
    </div>
    <main class="page">
        <!-- Header -->
        <div class="title" id="title">
            <div class="small">
                You have been invited
                TO
            </div>
            <h1>
                "???"
            </h1>
            <p>A mysterious invitation awaits you...</p>
        </div>
        <!-- Envelope -->
        <div
            
            class="envelope-container"
            id="envelope"
            onclick="openInvitation()">
            <div class="open-text">
                CLICK TO OPEN
            </div>
            <div class="envelope">         
                </div>
                <!-- Envelope -->
                <div class="envelope-body"></div>
                <div class="flap"></div>
                <!-- Seal -->
                <div class="seal">
                    ✯
                </div>
            </div>
            
        </div>
        <!-- Extra content -->
        <section class="extra" id="extra">
            <div class="section-title">
                THE SECRET INVITATION
            </div>
            <div class="discord-box">
                <a href="https://discord.com/invite/4UvU7e9Gnk" target="_blank"> Click here!! </a>
            </div>
            <div class="buttons">
                <button onclick="replayInvitation()">
                    ↻ CLOSE INVITATION
                </button>
                <button onclick="copyInvitation()">
                    ♢ COPY INVITATION
                </button>
            </div>
        </section>
        <footer>
            THIS INVITATION IS INTENDED FOR THE SELECTED GUEST
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
